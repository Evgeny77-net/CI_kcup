name: Full-Stack Microservices CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

# Отменяет предыдущий запущенный CI для того же PR, если прилетел новый коммит
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Быстрая параллельная проверка каждого сервиса (Static Analysis + Unit Tests)
  lint-and-unit:
    name: Lint & Unit (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # Если упадет один сервис, остальные все равно допроверятся
      matrix:
        service: [account, auth, transaction]
    defaults:
      run:
        working-directory: ./${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: ${{ matrix.service }}/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linter
        run: yarn lint

      - name: Build service
        run: yarn build

      - name: Run unit tests
        run: yarn test

  # 2. Интеграционная проверка всей системы (Postgres + Redis + Kafka + Все сервисы)
  integration-e2e:
    name: Integration & E2E Tests
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Infrastructure and Microservices
        run: |
          # Флаг --wait ждет, пока все сервисы с healthcheck перейдут в статус healthy
          docker compose -f docker-compose.ci.yml up -d --build --wait

      - name: Run Database Migrations
        run: |
          docker compose -f docker-compose.ci.yml exec -T account yarn migration:run
          docker compose -f docker-compose.ci.yml exec -T auth yarn migration:run
          docker compose -f docker-compose.ci.yml exec -T transaction yarn migration:run

      - name: Run Cross-Service E2E Tests (Saga & Kafka flows)
        run: |
          docker compose -f docker-compose.ci.yml exec -T transaction yarn test:e2e

      - name: Collect Logs on Failure
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker compose -f docker-compose.ci.yml ps
          echo "=== Service Logs ==="
          docker compose -f docker-compose.ci.yml logs --tail=100

      - name: Teardown Infrastructure
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
