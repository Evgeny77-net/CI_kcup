services:
  # ==================== ИНФРАСТРУКТУРА ====================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: microservices_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci_user -d microservices_ci"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ci-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ci-network

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - ci-network

  # ==================== МИКРОСЕРВИСЫ ====================
  account:
    build:
      context: ./account
      dockerfile: Dockerfile
    environment:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://ci_user:ci_password@postgres:5432/microservices_ci
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ci-network

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    environment:
      NODE_ENV: test
      PORT: 3002
      DATABASE_URL: postgresql://ci_user:ci_password@postgres:5432/microservices_ci
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: super-secret-ci-key
      ACCOUNT_SERVICE_URL: http://account:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - ci-network

  transaction:
    build:
      context: ./transaction
      dockerfile: Dockerfile
    environment:
      NODE_ENV: test
      PORT: 3003
      DATABASE_URL: postgresql://ci_user:ci_password@postgres:5432/microservices_ci
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account:3001
      AUTH_SERVICE_URL: http://auth:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account:
        condition: service_started
      auth:
        condition: service_started
    networks:
      - ci-network

networks:
  ci-network:
    driver: bridge
